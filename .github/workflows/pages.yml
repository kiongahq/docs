name: Docs

# Product documentation only. Engineering sources live in a private repository.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'  # hourly, so new component releases appear on the changelog
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DISABLE_MKDOCS_2_WARNING: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: 22}
      - run: npm ci --prefix ui --ignore-scripts
      - run: npm run build --prefix ui
      - run: npm test --prefix ui
      - name: Refresh the published component changelog
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/sync_releases.py
      - run: mkdocs build --strict --site-dir _site
      - run: python scripts/check_public_site.py _site
      - name: Archive the Pages site
        if: github.event_name != 'pull_request'
        run: |
          tar --dereference --hard-dereference --directory _site \
            -cf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .
      - name: Upload the Pages archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  # Docs references (make targets, paths, env vars, routes, CLI, SDK) checked
  # against the main branches of the component repositories. A separate job so
  # drift introduced by a code change is reported without blocking publication
  # of unrelated documentation fixes.
  # Prose style: the Google developer documentation style guide via Vale.
  # Errors fail the job; warnings and suggestions are advisory.
  prose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Vale
        run: |
          curl -sSL https://github.com/errata-ai/vale/releases/download/v3.23.0/vale_3.23.0_Linux_64-bit.tar.gz | tar xz -C /usr/local/bin vale
          vale --version
      - run: vale sync
      - run: vale --minAlertLevel=error docs README.md CONTRIBUTING.md

  # Every mermaid diagram must parse; a syntax error publishes as raw text.
  diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: 22}
      - run: npm install --prefix scripts --no-audit --no-fund
      - run: node scripts/check_mermaid.mjs docs

  references:
    runs-on: ubuntu-latest
    env:
      KIONGA_SRC: ${{ github.workspace }}/src
      KIONGA_GIT_BASE: https://github.com/kiongahq/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Clone the component repositories
        run: |
          git clone -q --depth 1 "${KIONGA_GIT_BASE}deploy.git" "$KIONGA_SRC/deploy"
          bash "$KIONGA_SRC/deploy/scripts/workspace.sh"
      - run: python -m pip install pytest pyyaml
      - run: python -m pytest -q tests
      - run: python scripts/check_references.py --root "$KIONGA_SRC" --product

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
