name: Docs

# Strict build of both sites (product documentation at /, engineering handbook
# at /engineering/) and reference checks on every PR; publish from main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DISABLE_MKDOCS_2_WARNING: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict --site-dir _site
      - run: mkdocs build --strict -f engineering/mkdocs.yml --site-dir ../_site/engineering
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  # Docs references (make targets, paths, env vars, routes, CLI, SDK) checked
  # against the main branches of the component repositories. A separate job so
  # drift introduced by a code change is reported without blocking publication
  # of unrelated documentation fixes.
  references:
    runs-on: ubuntu-latest
    env:
      KIONGA_SRC: ${{ github.workspace }}/src
      KIONGA_GIT_BASE: https://github.com/kiongahq/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clone the component repositories
        run: |
          git clone -q --depth 1 "${KIONGA_GIT_BASE}deploy.git" "$KIONGA_SRC/deploy"
          bash "$KIONGA_SRC/deploy/scripts/workspace.sh"
      - run: python -m pip install pytest pyyaml
      - run: python -m pytest -q tests
      - run: python scripts/check_references.py --root "$KIONGA_SRC" --product
      - run: python scripts/check_references.py --root "$KIONGA_SRC" --docs engineering/docs

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
