# Engineering handbook: how Kionga is built. Published beside the product
# documentation at /docs/engineering/ (see the Docs workflow).
site_name: Kionga Engineering
site_description: >-
  How Kionga is designed and built: architecture (arc42), components, contracts,
  architecture decision records and contribution workflow.
site_author: Kionga contributors
site_url: https://kiongahq.github.io/docs/engineering/
repo_name: kiongahq
repo_url: https://github.com/kiongahq
edit_uri: https://github.com/kiongahq/docs/edit/main/engineering/docs/
docs_dir: docs
copyright: Copyright &copy; 2026 Kionga contributors. Released under the MIT License.

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Use system preference
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil-outline

extra_css:
  - stylesheets/kionga.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kiongahq
      name: Kionga on GitHub
    - icon: material/book-open-page-variant-outline
      link: https://kiongahq.github.io/docs/
      name: Product documentation

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

plugins:
  - search

nav:
  - Home: index.md
  - Architecture:
      - architecture/index.md
      - Technology: architecture/technology.md
  - Components:
      - components/index.md
      - Gateway and control plane: components/gateway.md
      - Data and messaging: components/data-plane.md
      - Execution and serving: components/execution.md
      - AI and observability: components/ai-observability.md
      - Go packages: components/go-packages.md
      - Python modules: components/python-modules.md
  - Contracts:
      - Backend contracts: contracts/backend.md
  - Decisions:
      - decisions/index.md
      - "0001 DAG layout library": decisions/0001-dag-layout-library.md
      - "0002 Blog editor": decisions/0002-blog-editor.md
      - "0003 Bundled object store": decisions/0003-object-store.md
  - Status and plans:
      - Implementation status: status/implementation-status.md
      - Identifier migration: status/identifier-migration.md
      - First-iteration deployment plan: plans/first-iteration-deployment.md
