site_name: Kionga
site_description: >-
  Kionga is a self-hosted platform for machine learning, data and AI agents:
  workspaces, pipelines, model serving, feature stores and agent operations
  on infrastructure you control.
site_author: Kionga contributors
site_url: https://kiongahq.github.io/docs/
repo_name: kiongahq
repo_url: https://github.com/kiongahq
edit_uri: https://github.com/kiongahq/docs/edit/main/docs/
docs_dir: docs
copyright: Copyright &copy; 2026 Kionga contributors. Released under the MIT License.

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Use system preference
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil-outline

extra_css:
  - stylesheets/kionga.css

extra_javascript:
  - javascripts/assistant.js

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kiongahq
      name: Kionga on GitHub
    - icon: material/book-cog-outline
      link: https://kiongahq.github.io/docs/engineering/
      name: Engineering handbook

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

plugins:
  - search
  - redirects:
      redirect_maps:
        "getting-started/configuration.md": "reference/configuration.md"
        "connecting-services.md": "reference/service-endpoints.md"
        "services/index.md": "reference/services.md"
        "overview/index.md": "concepts/index.md"
        "overview/what-is-kionga.md": "concepts/what-is-kionga.md"
        "overview/concepts.md": "concepts/core-concepts.md"
        "overview/open-source.md": "concepts/open-source.md"
        "overview/architecture.md": "https://kiongahq.github.io/docs/engineering/architecture/"
        "overview/technology.md": "https://kiongahq.github.io/docs/engineering/architecture/technology/"
        "overview/repositories.md": "https://kiongahq.github.io/docs/engineering/components/"
        "services/gateway.md": "https://kiongahq.github.io/docs/engineering/components/gateway/"
        "services/data-plane.md": "https://kiongahq.github.io/docs/engineering/components/data-plane/"
        "services/execution.md": "https://kiongahq.github.io/docs/engineering/components/execution/"
        "services/ai-observability.md": "https://kiongahq.github.io/docs/engineering/components/ai-observability/"
        "modules/go-packages.md": "https://kiongahq.github.io/docs/engineering/components/go-packages/"
        "modules/python.md": "https://kiongahq.github.io/docs/engineering/components/python-modules/"
        "reference/backend.md": "https://kiongahq.github.io/docs/engineering/contracts/backend/"
        "reference/implementation-status.md": "https://kiongahq.github.io/docs/engineering/status/implementation-status/"
        "reference/kionga-migration.md": "https://kiongahq.github.io/docs/engineering/status/identifier-migration/"
        "operations/first-iteration-deployment.md": "https://kiongahq.github.io/docs/engineering/plans/first-iteration-deployment/"
        "reference/decisions/graph-library.md": "https://kiongahq.github.io/docs/engineering/decisions/0001-dag-layout-library/"
        "reference/decisions/blog-editor.md": "https://kiongahq.github.io/docs/engineering/decisions/0002-blog-editor/"
        "reference/decisions/object-store.md": "https://kiongahq.github.io/docs/engineering/decisions/0003-object-store/"

